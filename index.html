<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-sky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בית עלמא</title>
  <meta name="theme-color" content="#7BAEC4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="alma-enso.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">

</head>
<body>
  <header class="strip">
    <span class="brand">
      <img class="brand-mark" src="alma-enso.svg" alt="עלמא" decoding="async">
      <span class="title">בית עלמא</span>
    </span>
    <span class="chips">
      <span id="chip-auth" class="chip clickable">…</span>
    </span>
  </header>

  <main class="content">
    <section id="page-home" class="page active"></section>
    <section id="page-capture" class="page"></section>
    <section id="page-threads" class="page"></section>
    <section id="page-questions" class="page"></section>
    <section id="page-actions" class="page"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-route="home">
      <svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3z"/></svg>
      <span>בית</span>
    </button>
    <button class="nav-btn" data-route="capture">
      <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3zm7 9a7 7 0 0 1-6 6.92V21h-2v-3.08A7 7 0 0 1 5 11h2a5 5 0 0 0 10 0h2z"/></svg>
      <span>לכידה</span>
    </button>
    <button class="nav-btn" data-route="threads">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></svg>
      <span>חוטים</span>
    </button>
    <button class="nav-btn" data-route="questions">

      <span>שאלות</span>
    </button>
    <button class="nav-btn" data-route="actions">
      <svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5zm0 6h2v2H3v-2zm0 6h2v2H3v-2zm4-11h14v2H7V6zm0 6h14v2H7v-2zm0 6h14v2H7v-2z"/></svg>
      <span>משימות</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>

</html>
