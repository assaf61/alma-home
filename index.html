  <nav class="bottom-nav">

      <span>בית</span>
    </button>

    <button class="nav-btn" data-route="answer">

      <span>מה השאלה?</span>
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
  <script src="read-aloud-neural.js"></script>
